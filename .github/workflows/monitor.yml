name: VPS restock monitor

# 云端兜底：即使你的 Windows 关机 / 代理没开，也照常监控并推送到微信。
# 注意：公开仓库的 Actions 免费用量不限；私有仓库受免费额度限制（按分钟向上取整），
#      建议公开仓库用 */5，私有仓库把 cron 放宽到 */30。

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification instead of polling (used to verify the WeChat channel)'
        type: boolean
        default: false

permissions:
  contents: write

# 避免两次轮询重叠、互相覆盖 state
concurrency:
  group: vps-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Poll once
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          NOTIFY_CHANNELS: wxpusher
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            echo "== test-notify mode: 只发一条测试推送，不轮询 =="
            node monitor.mjs --test-notify
          else
            node monitor.mjs --once --verbose
          fi

      - name: Persist state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 两次运行可能重叠（例如手动触发撞上定时器，或 GitHub 自带 cron 若哪天恢复）。
          # 此时后一次的 push 会被拒。通知早在 Poll 步骤就已发出，所以状态回写是
          # 尽力而为：重试若干次；仍失败也只告警、不判死，避免把一次「通知已成功」
          # 的运行误标成 failure。
          for i in 1 2 3 4 5; do
            if git pull --rebase --no-edit origin main >/dev/null 2>&1 && git push >/dev/null 2>&1; then
              echo "state pushed (attempt $i)"
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 4
          done
          echo "::warning::state push failed after 5 attempts; notification was already delivered, state will be rebuilt on the next run"
          exit 0
